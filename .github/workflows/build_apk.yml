name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

defaults:
  run:
    working-directory: cat_translator/cat_translator

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: 사전학습 YAMNet 모델/라벨 받기
        run: python3 tools/fetch_model.py

      - name: 패키지 설치
        run: flutter pub get

      - name: 정적 분석 (경고만, 실패시켜도 빌드는 계속)
        run: flutter analyze || true

      - name: APK 빌드
        run: flutter build apk --release

      - name: 빌드 결과물 업로드 (Actions 아티팩트)
        uses: actions/upload-artifact@v4
        with:
          name: cat-translator-apk
          path: cat_translator/cat_translator/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: GitHub Release로 다운로드 링크 생성
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "고양이 번역 앱 빌드 #${{ github.run_number }}"
          files: cat_translator/cat_translator/build/app/outputs/flutter-apk/app-release.apk
          body: |
            자동 빌드된 안드로이드 APK입니다. 휴대폰에서 이 파일을 다운로드해
            "출처를 알 수 없는 앱 설치"를 허용한 뒤 설치하면 바로 사용할 수 있습니다.

name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

defaults:
  run:
    working-directory: cat_translator/cat_translator

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: 사전학습 YAMNet 모델/라벨 받기
        run: python3 tools/fetch_model.py

      - name: 패키지 설치
        run: flutter pub get

      - name: 정적 분석 (경고만, 실패시켜도 빌드는 계속)
        run: flutter analyze || true

      - name: 릴리스 서명 키 설정 (GitHub Secrets에 등록된 경우에만 적용)
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          cat > android/key.properties <<PROPS
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=$GITHUB_WORKSPACE/cat_translator/cat_translator/android/app/upload-keystore.jks
          PROPS

      - name: APK 빌드 (휴대폰 직접 설치/테스트용)
        run: flutter build apk --release

      - name: AAB 빌드 (플레이스토어 업로드용)
        run: flutter build appbundle --release

      - name: 빌드 결과물 업로드 (Actions 아티팩트)
        uses: actions/upload-artifact@v4
        with:
          name: cat-translator-apk
          path: |
            cat_translator/cat_translator/build/app/outputs/flutter-apk/app-release.apk
            cat_translator/cat_translator/build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: GitHub Release로 다운로드 링크 생성
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "고양이 번역 앱 빌드 #${{ github.run_number }}"
          files: |
            cat_translator/cat_translator/build/app/outputs/flutter-apk/app-release.apk
            cat_translator/cat_translator/build/app/outputs/bundle/release/app-release.aab
          body: |
            자동 빌드된 안드로이드 APK/AAB입니다.
            - app-release.apk: 휴대폰에서 다운로드해 "출처를 알 수 없는 앱 설치"를 허용한 뒤 설치하면 바로 테스트할 수 있습니다.
            - app-release.aab: 플레이스토어 콘솔에 업로드하는 파일입니다 (서명키 시크릿이 등록된 빌드만 정식 서명됨).
